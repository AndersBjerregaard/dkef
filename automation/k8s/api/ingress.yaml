apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dkef-api
  labels:
    app: dkef-api
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Site-image uploads allow 5 MiB plus multipart overhead; the API enforces the exact bound.
    nginx.ingress.kubernetes.io/proxy-body-size: "6m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.dkef.dk
      secretName: dkef-api-tls
  rules:
    - host: api.dkef.dk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dkef-api
                port:
                  number: 80
