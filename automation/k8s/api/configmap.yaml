apiVersion: v1
kind: ConfigMap
metadata:
  name: dkef-api-config
  labels:
    app: dkef-api
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://*:8080"
  UseSmtp: "true"
  Minio__Secure: "false"
  Minio__PublicEndpoint: "storage.dkef.dk"
  JwtSettings__Issuer: "https://api.dkef.dk"
  JwtSettings__Audience: "https://dkef.dk"
  JwtSettings__AccessTokenLifetimeMinutes: "15"
  JwtSettings__RefreshTokenLifetimeDays: "7"
  JwtSettings__ExpiryMinutes: "60"
  Logging__LogLevel__Default: "Information"
  Logging__LogLevel__Microsoft.AspNetCore: "Warning"
  MailConfiguration__Sender: "info@dkef.dk"
  MailConfiguration__Domain: "dkef.dk"
  MailConfiguration__To: "info@dkef.dk"
