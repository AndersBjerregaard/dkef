name: build

on:
  push:
    tags:
      - "api-v*.*.*"
      - "frontend-v*.*.*"
  workflow_dispatch:
    inputs:
      target:
        description: "Image target to build"
        required: true
        type: choice
        options:
          - api
          - frontend
          - both
      api_version:
        description: "Semver for API (required when target is api or both), example: 0.17.0"
        required: false
        type: string
      frontend_version:
        description: "Semver for frontend (required when target is frontend or both), example: 0.17.0"
        required: false
        type: string

jobs:
  api:
    if: ${{ startsWith(github.ref, 'refs/tags/api-v') || (github.event_name == 'workflow_dispatch' && (inputs.target == 'api' || inputs.target == 'both')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve API version and tags
        id: api_meta
        env:
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_API_VERSION: ${{ inputs.api_version }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            VERSION="${GITHUB_REF_NAME#api-v}"
          else
            VERSION="${INPUT_API_VERSION}"
            if [[ "${INPUT_TARGET}" == "api" || "${INPUT_TARGET}" == "both" ]]; then
              if [[ -z "${VERSION}" ]]; then
                echo "api_version is required when target is api or both"
                exit 1
              fi
            fi
          fi

          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be semver MAJOR.MINOR.PATCH, got: ${VERSION}"
            exit 1
          fi

          MAJOR="${VERSION%%.*}"
          MINOR="${VERSION%.*}"
          SHORT_SHA="${GITHUB_SHA::7}"

          {
            echo "version=${VERSION}"
            echo "tags<<EOF"
            echo "${DOCKERHUB_USERNAME}/dkef-api:${VERSION}"
            echo "${DOCKERHUB_USERNAME}/dkef-api:${MINOR}"
            echo "${DOCKERHUB_USERNAME}/dkef-api:${MAJOR}"
            echo "${DOCKERHUB_USERNAME}/dkef-api:latest"
            echo "${DOCKERHUB_USERNAME}/dkef-api:sha-${SHORT_SHA}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push API (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: src/dkef-api/
          file: src/dkef-api/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.api_meta.outputs.tags }}

  frontend:
    if: ${{ startsWith(github.ref, 'refs/tags/frontend-v') || (github.event_name == 'workflow_dispatch' && (inputs.target == 'frontend' || inputs.target == 'both')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve frontend version and tags
        id: frontend_meta
        env:
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_FRONTEND_VERSION: ${{ inputs.frontend_version }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            VERSION="${GITHUB_REF_NAME#frontend-v}"
          else
            VERSION="${INPUT_FRONTEND_VERSION}"
            if [[ "${INPUT_TARGET}" == "frontend" || "${INPUT_TARGET}" == "both" ]]; then
              if [[ -z "${VERSION}" ]]; then
                echo "frontend_version is required when target is frontend or both"
                exit 1
              fi
            fi
          fi

          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be semver MAJOR.MINOR.PATCH, got: ${VERSION}"
            exit 1
          fi

          MAJOR="${VERSION%%.*}"
          MINOR="${VERSION%.*}"
          SHORT_SHA="${GITHUB_SHA::7}"

          {
            echo "version=${VERSION}"
            echo "tags<<EOF"
            echo "${DOCKERHUB_USERNAME}/dkef-frontend:${VERSION}"
            echo "${DOCKERHUB_USERNAME}/dkef-frontend:${MINOR}"
            echo "${DOCKERHUB_USERNAME}/dkef-frontend:${MAJOR}"
            echo "${DOCKERHUB_USERNAME}/dkef-frontend:latest"
            echo "${DOCKERHUB_USERNAME}/dkef-frontend:sha-${SHORT_SHA}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push frontend (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: src/dkef-vue/
          file: src/dkef-vue/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.frontend_meta.outputs.tags }}
